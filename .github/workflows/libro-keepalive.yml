# Mantiene activo el proyecto gratuito de Supabase del Libro de Reclamaciones:
# los proyectos gratuitos se pausan tras una semana sin uso y el libro dejaría de recibir hojas.
name: Libro de Reclamaciones (mantener activo)

on:
  schedule:
    - cron: '17 13 * * 1,4' # lunes y jueves, 08:17 en Lima
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar el estado del libro
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            https://buuelzmvfidigimbrplm.supabase.co/functions/v1/libro-reclamaciones
